<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AI Gym Trainer</title>

  <!-- Bootstrap 5 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      /* High-quality dark gym ambient background with contrast overlay */
      background: 
        linear-gradient(rgba(10, 12, 16, 0.85), rgba(10, 12, 16, 0.92)),
        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      padding: 20px 0;
    }

    .login-card {
      background: rgba(24, 28, 36, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65);
    }

    /* Fitness Logo Icon Badge */
    .brand-icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(0, 255, 136, 0.1);
      border: 1.5px solid #00ff88;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      fill: #00ff88;
    }

    .form-control {
      background-color: rgba(15, 17, 21, 0.75);
      border: 1px solid #282f3d;
      color: #fff;
      padding: 12px 14px;
    }

    .form-control:focus {
      background-color: rgba(15, 17, 21, 0.95);
      border-color: #00ff88;
      box-shadow: 0 0 0 0.25rem rgba(0, 255, 136, 0.2);
      color: #fff;
    }

    .btn-brand {
      background-color: #00ff88;
      color: #0f1115;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
    }

    .btn-brand:hover {
      background-color: #00cc6a;
      color: #000;
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
    }

    .link-accent {
      color: #00ff88;
      text-decoration: none;
      font-weight: 600;
    }

    .link-accent:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        
        <div class="card login-card p-4 p-sm-5">
          <!-- Themed Logo Badge -->
          <div class="text-center mb-3">
            <div class="brand-icon-wrapper">
              <!-- Geometric Dumbbell SVG -->
              <svg class="brand-icon" viewBox="0 0 24 24">
                <path d="M20.57 14.86L22 13.43L20.57 12L17 15.57L8.43 7L12 3.43L10.57 2L9.14 3.43L7.71 2L5.57 4.14L4.14 2.71L2.71 4.14L4.14 5.57L2 7.71L3.43 9.14L2 10.57L3.43 12L7 8.43L15.57 17L12 20.57L13.43 22L14.86 20.57L16.29 22L18.43 19.86L19.86 21.29L21.29 19.86L19.86 18.43L22 16.29L20.57 14.86Z"/>
              </svg>
            </div>
            <h2 class="fw-bold text-white mb-1">AI Gym Trainer</h2>
            <p class="text-secondary small">Real-time computer vision repetition tracker</p>
          </div>

          <form method="POST" action="{{ url_for('loging') }}">
            <div class="mb-3">
              <label for="username" class="form-label small fw-semibold text-light">Username</label>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-control" 
                placeholder="e.g. Muhammed" 
                required 
                autofocus
              />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-semibold text-light">Password</label>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control" 
                placeholder="••••••••" 
                required
              />
            </div>

            <button type="submit" class="btn btn-brand w-100 mb-3">
              Enter Studio &rarr;
            </button>
          </form>

          <div class="text-center">
            <span class="text-secondary small">New here? </span>
            <a href="{{ url_for('signup') }}" class="link-accent small">Create an account</a>
          </div>

        </div>

      </div>
    </div>
  </div>

</body>
</html>
