<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | AI Gym</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body {
      background-color: #0f1115;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto 15px auto;
    }

    .btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-back { background: #282f3d; color: #e0e0e0; border: 1px solid #444; }
    .btn-back:hover { background: #3b4455; }
    .btn-reset { background: #ff4d4f; color: #fff; }
    .btn-reset:hover { background: #d9363e; }

    .hud {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px 25px;
      background: #181c24;
      border: 1px solid #282f3d;
      border-radius: 10px;
      display: inline-block;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #000;
      border: 2px solid #00ff88;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Keep the webcam feed directly visible */
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Processed MediaPipe overlay from server */
    #feed-display {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* revealed as soon as server responds */
    }

    .feedback-box {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #00d0ff;
      font-weight: 600;
      min-height: 24px;
    }

    .bottom-bar {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .btn-finish {
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #ffffff;
      border: 1px solid #3fb950;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/home/exercises" class="btn btn-back">&larr; Exercises</a>
    <h3 style="margin: 0;">{{ title }}</h3>
    <button type="button" class="btn btn-reset" onclick="resetWorkout()">Reset Reps</button>
  </div>

  <div class="hud">
    <span style="color: #00ff88; margin-right: 25px;">
      Count: <span id="rep_count">0</span>
    </span>
    <span style="color: #2ea043;">
      Stage: <span id="stage_val">READY</span>
    </span>
  </div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <img id="feed-display" alt="Overlay Stream" />
  </div>

  <div class="feedback-box" id="feedback_text">Initializing camera...</div>

  <div class="bottom-bar">
    <button id="finish-btn" type="button" class="btn-finish" onclick="finishSession()">
      🏁 Finish Workout & Save
    </button>
  </div>

  <!-- Offscreen canvas for grabbing frames -->
  <canvas id="capture_canvas" width="480" height="360" style="display: none;"></canvas>

  <script>
    const socket = io({
    transports: ['websocket'],
    upgrade: false
  });

    const currentExercise = "{{ exercise_key }}";
    const currentTitle = "{{ title }}";

    const video = document.getElementById('webcam');
    const feedDisplay = document.getElementById('feed-display');
    const feedbackText = document.getElementById('feedback_text');
    const canvas = document.getElementById('capture_canvas');
    const ctx = canvas.getContext('2d');

    let localStream = null;
    let isProcessing = false;
    let streamingActive = false;

    socket.on('connect', () => {
  console.log("Socket connected with ID:", socket.id);
  feedbackText.innerText = "Connected! Syncing with AI...";
  isProcessing = false;
  if (streamingActive) {
    sendFrame();
  }
});

    socket.on('connect_error', (err) => {
      console.error("Socket connection error:", err);
      feedbackText.innerText = "Reconnecting to server...";
    });

    // 1. Request Webcam with standard constraints
    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false
    })
    .then(stream => {
      localStream = stream;
      video.srcObject = stream;
      video.play().then(() => {
        feedbackText.innerText = "Camera active. Syncing with AI...";
        streamingActive = true;
        // Start ping-pong frame loop
        sendFrame();
      }).catch(e => {
        console.error("Video play failed:", e);
      });
    })
    .catch(err => {
      console.error("getUserMedia error:", err);
      feedbackText.innerText = "Camera access error: " + err.name;
    });

    // 2. Ping-Pong Frame Sender
    // Robust Request-Response Loop
    function sendFrame() {
      if (!streamingActive) return;

      // 1. If video isn't ready or socket isn't connected yet, retry in 100ms
      if (video.videoWidth === 0 || !socket.connected) {
        setTimeout(sendFrame, 100);
        return;
      }

      // 2. Send frame only if previous frame has completed
      if (!isProcessing) {
        isProcessing = true;
        ctx.drawImage(video, 0, 0, 480, 360);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.4);

        socket.emit('process_frame', {
          exercise_key: currentExercise,
          image: dataUrl
        });

        // 3. Watchdog timeout: If server doesn't respond within 500ms, unlock and send next frame
        setTimeout(() => {
          if (isProcessing) {
            console.warn("Frame response timed out, re-triggering sendFrame...");
            isProcessing = false;
            sendFrame();
          }
        }, 500);
      }
    }

    // 4. When the server replies with processed frame
    socket.on('frame_result', data => {
      if (data.image) {
        feedDisplay.src = data.image;
        feedDisplay.style.display = 'block';
      }
      if (data.count !== undefined) document.getElementById('rep_count').innerText = data.count;
      if (data.stage !== undefined) document.getElementById('stage_val').innerText = data.stage;
      if (data.feedback) document.getElementById('feedback_text').innerText = data.feedback;

      // Unlock and immediately send next frame
      isProcessing = false;
      sendFrame();
    });

    // 3. Receive Processed Frame from Backend
    socket.on('frame_result', data => {
      if (data.image) {
        feedDisplay.src = data.image;
        feedDisplay.style.display = 'block'; // Make overlay visible
      }
      if (data.count !== undefined) document.getElementById('rep_count').innerText = data.count;
      if (data.stage !== undefined) document.getElementById('stage_val').innerText = data.stage;
      if (data.feedback) document.getElementById('feedback_text').innerText = data.feedback;

      isProcessing = false;
      sendFrame();
    });

    function resetWorkout() {
      socket.emit('reset_active_workout', { exercise_key: currentExercise });
    }

    socket.on('workout_reset', data => {
      document.getElementById('rep_count').innerText = 0;
      document.getElementById('stage_val').innerText = data.stage;
      document.getElementById('feedback_text').innerText = data.feedback;
    });

    async function finishSession() {
      streamingActive = false;
      const finishBtn = document.getElementById('finish-btn');
      finishBtn.disabled = true;
      finishBtn.innerText = "Saving to Profile...";

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      const totalReps = parseInt(document.getElementById('rep_count').innerText) || 0;

      try {
        await fetch('/save_workout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            exercise: currentTitle,
            total_reps: totalReps,
            l_cnt: totalReps,
            r_cnt: totalReps
          })
        });
      } catch (err) {
        console.error("Save error:", err);
      }

      window.location.href = '/home';
    }
  </script>
</body>
</html>
