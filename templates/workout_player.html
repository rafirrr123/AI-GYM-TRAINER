<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | AI Gym</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body {
      background-color: #0f1115;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto 15px auto;
    }

    .btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-back { background: #282f3d; color: #e0e0e0; border: 1px solid #444; }
    .btn-back:hover { background: #3b4455; }
    .btn-reset { background: #ff4d4f; color: #fff; }
    .btn-reset:hover { background: #d9363e; }

    .hud {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 12px 25px;
      background: #181c24;
      border: 1px solid #282f3d;
      border-radius: 10px;
      display: inline-block;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #000;
      border: 2px solid #00ff88;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Live local webcam */
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Processed skeleton overlay from backend */
    #feed-display {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .feedback-box {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #00d0ff;
      font-weight: 600;
      min-height: 24px;
    }

    .bottom-bar {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .btn-finish {
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #ffffff;
      border: 1px solid #3fb950;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/home/exercises" class="btn btn-back">&larr; Exercises</a>
    <h3 style="margin: 0;">{{ title }}</h3>
    <button type="button" class="btn btn-reset" onclick="resetWorkout()">Reset Reps</button>
  </div>

  <div class="hud">
    <span style="color: #00ff88; margin-right: 25px;">
      Count: <span id="rep_count">0</span>
    </span>
    <span style="color: #2ea043;">
      Stage: <span id="stage_val">READY</span>
    </span>
  </div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <img id="feed-display" alt="Overlay Stream" />
  </div>

  <div class="feedback-box" id="feedback_text">Connecting to server...</div>

  <div class="bottom-bar">
    <button id="finish-btn" type="button" class="btn-finish" onclick="finishSession()">
      🏁 Finish Workout & Save
    </button>
  </div>

  <!-- Capture canvas sized to 320x240 for low CPU consumption on Render -->
  <canvas id="canvas" width="320" height="240" style="display: none;"></canvas>

  <script>
    const socket = io({
      transports: ['websocket', 'polling'],
      reconnectionAttempts: 15,
      reconnectionDelay: 1000,
      timeout: 10000
    });

    const currentExercise = "{{ exercise_key }}";
    const currentTitle = "{{ title }}";

    const video = document.getElementById('webcam');
    const feedDisplay = document.getElementById('feed-display');
    const feedbackText = document.getElementById('feedback_text');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let localStream = null;
    let isProcessing = false;
    let streamingActive = false;
    let watchdogTimer = null;
    let socketConnected = false;
    const FRAME_TIMEOUT_MS = 15000;
    const FRAME_INTERVAL_MS = 250;

    socket.on('connect', () => {
      console.log("Socket connected with ID:", socket.id);
      socketConnected = true;
      feedbackText.innerText = "Connected! Syncing with AI...";
      isProcessing = false;
      if (streamingActive) {
        sendFrame();
      }
    });

    socket.on('connect_error', (err) => {
      socketConnected = false;
      console.error("Socket connection error:", err);
      feedbackText.innerText = "Reconnecting to server...";
    });

    socket.on('disconnect', reason => {
      socketConnected = false;
      isProcessing = false;
      clearTimeout(watchdogTimer);
      console.warn("Socket disconnected:", reason);
      feedbackText.innerText = "Connection lost. Reconnecting to AI...";
    });

    // Request Webcam
    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false
    })
    .then(stream => {
      localStream = stream;
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.muted = true;

      video.onloadeddata = () => {
        video.play().then(() => {
          feedbackText.innerText = socketConnected
            ? "Position yourself in front of camera"
            : "Camera ready. Connecting to AI...";
          streamingActive = true;
          sendFrame();
        }).catch(e => {
          console.error("Video play failed:", e);
        });
      };
    })
    .catch(err => {
      console.error("getUserMedia error:", err);
      feedbackText.innerText = "Camera access error: " + err.name;
    });

    // Throttled frame transmission loop
    function sendFrame() {
      if (!streamingActive) return;

      if (video.videoWidth === 0 || !socket.connected) {
        setTimeout(sendFrame, 150);
        return;
      }

      if (!isProcessing) {
        isProcessing = true;
        // 320x240 keeps upload and inference affordable on a Render web service.
        ctx.drawImage(video, 0, 0, 320, 240);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.5);

        socket.emit('process_frame', {
          exercise_key: currentExercise,
          image: dataUrl
        });

        // A cold Render instance may need several seconds to load MediaPipe.
        // Do not send a duplicate frame while it is still loading/processing.
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
          if (isProcessing) {
            console.warn("Backend busy/frame dropped, retrying stream...");
            isProcessing = false;
            sendFrame();
          }
        }, FRAME_TIMEOUT_MS);
      }
    }

    // Processed frame returned from backend
    socket.on('frame_result', data => {
      clearTimeout(watchdogTimer);

      if (data.image) {
        feedDisplay.src = data.image;
        feedDisplay.style.display = 'block';
      }
      if (data.count !== undefined) document.getElementById('rep_count').innerText = data.count;
      if (data.stage !== undefined) document.getElementById('stage_val').innerText = data.stage;
      if (data.feedback) document.getElementById('feedback_text').innerText = data.feedback;

      isProcessing = false;
      setTimeout(sendFrame, FRAME_INTERVAL_MS);
    });

    socket.on('frame_error', data => {
      clearTimeout(watchdogTimer);
      isProcessing = false;
      console.error("Pose processing error:", data.message);
      feedbackText.innerText = data.message || "Pose processing failed. Check the server logs.";
    });

    function resetWorkout() {
      socket.emit('reset_active_workout', { exercise_key: currentExercise });
    }

    socket.on('workout_reset', data => {
      document.getElementById('rep_count').innerText = 0;
      document.getElementById('stage_val').innerText = data.stage;
      document.getElementById('feedback_text').innerText = data.feedback;
    });

    async function finishSession() {
      streamingActive = false;
      clearTimeout(watchdogTimer);
      const finishBtn = document.getElementById('finish-btn');
      finishBtn.disabled = true;
      finishBtn.innerText = "Saving to Profile...";

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      const totalReps = parseInt(document.getElementById('rep_count').innerText) || 0;

      try {
        await fetch('/save_workout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            exercise: currentTitle,
            total_reps: totalReps,
            l_cnt: totalReps,
            r_cnt: totalReps
          })
        });
      } catch (err) {
        console.error("Save error:", err);
      }

      window.location.href = '/home';
    }
  </script>
</body>
</html>
